services:
  postgres:
    image: postgres:16-alpine
    container_name: upgrade-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: upgrade
      POSTGRES_PASSWORD: upgrade_local_password
      POSTGRES_DB: upgrade
    ports:
      - "5432:5432"
    volumes:
      - upgrade_pgdata:/var/lib/postgresql/data

volumes:
  upgrade_pgdata:
